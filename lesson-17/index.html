<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Lesson 17</title>
</head>

<body>

    <h1 id="title">JavaScript Events</h1>

    <p id="message">
        Click the button.
    </p>

    <button id="button">
        Click Me
    </button>

    <hr>

    <h2>Input Event</h2>

    <input
        type="text"
        id="nameInput"
        placeholder="Enter your name"
    >

    <p id="nameOutput"></p>

    <hr>

    <h2>Keyboard Event</h2>

    <input
        type="text"
        id="keyboardInput"
        placeholder="Press a key"
    >

    <p id="keyOutput"></p>

    <script src="script.js"></script>

</body>
</html>
