<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Lesson 19</title>
</head>
<body>

    <h1>Developer Skills Saver</h1>

    <form id="skillForm">
        <label for="skillInput">Enter your skill:</label>

        <input
            type="text"
            id="skillInput"
            placeholder="e.g. Python"
        >

        <button type="submit">Add Skill</button>
    </form>

    <h2>My Skills</h2>

    <ul id="skillList"></ul>

    <p id="message"></p>

    <button id="clearButton" type="button">
        Clear All Skills
    </button>

    <script src="script.js"></script>

</body>
</html>
